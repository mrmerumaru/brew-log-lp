<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew Log — A coffee consistency tracker.</title>
    <meta
      name="description"
      content="Log every variable of a brew, attach a photo of the cup, and look back at what produced your best results."
    />

    <!--
      Production URL: theonebrewlog.vercel.app, matching the Instagram
      handle (PRD §9) — the project's auto-generated alias (brewloglp.
      vercel.app, from the brew-log-lp repo/project name) still works as a
      secondary alias on the same deployment, but this is the canonical one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brew Log — A coffee consistency tracker." />
    <meta
      property="og:description"
      content="Log every variable of a brew, attach a photo of the cup, and look back at what produced your best results."
    />
    <meta property="og:image" content="https://theonebrewlog.vercel.app/images/share-card.png" />
    <meta property="og:url" content="https://theonebrewlog.vercel.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brew Log — A coffee consistency tracker." />
    <meta
      name="twitter:description"
      content="Log every variable of a brew, attach a photo of the cup, and look back at what produced your best results."
    />
    <meta name="twitter:image" content="https://theonebrewlog.vercel.app/images/share-card.png" />

    <link rel="canonical" href="https://theonebrewlog.vercel.app/" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Preload the Hero's LCP image. This is a pure client-rendered SPA, so
      without this the browser can't discover the <img src> until the JS
      bundle has downloaded, parsed and run React — a Lighthouse audit
      (lcp-discovery-insight) measured that delay at over a second.
    -->
    <link rel="preload" as="image" href="/images/share-card-hero.png" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-render-blocking (unlike marooj_coffee's plain blocking
      <link>, SDD §6) — this landing page is a first-impression, LCP-
      sensitive static page, not an authenticated app the user already
      committed to opening. The preload+media-swap pattern lets first
      paint start before the stylesheet arrives; font-display:swap (still
      in the URL) then prevents an invisible-text flash once it does.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
